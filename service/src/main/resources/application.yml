server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
  netty:
    connection-timeout: 3s

spring:
  application:
    name: kiro-proxy-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  r2dbc:
    url: r2dbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:kiro_proxy}?useServerPrepareStatement=true&tcpKeepAlive=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    pool:
      initial-size: ${MYSQL_POOL_INITIAL_SIZE:8}
      max-size: ${MYSQL_POOL_MAX_SIZE:80}
      max-idle-time: 30m
      validation-query: SELECT 1
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:kiro_proxy}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    user: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
  codec:
    max-in-memory-size: ${SPRING_CODEC_MAX_IN_MEMORY_SIZE:16MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

kiro:
  proxy:
    admin-token: ${KIRO_ADMIN_TOKEN:}
    webui-url: ${KIRO_WEBUI_URL:}
    admin-session-ttl: ${KIRO_ADMIN_SESSION_TTL:12h}
    allow-anonymous-proxy: ${KIRO_ALLOW_ANONYMOUS_PROXY:false}
    request-timeout: ${KIRO_REQUEST_TIMEOUT:90s}
    max-retries: ${KIRO_MAX_RETRIES:2}
    rate-limit-per-minute: ${KIRO_RATE_LIMIT_PER_MINUTE:120}
    account-selection-strategy: ${KIRO_ACCOUNT_SELECTION_STRATEGY:round_robin}
    session-affinity-enabled: ${KIRO_SESSION_AFFINITY_ENABLED:true}
    session-affinity-ttl: ${KIRO_SESSION_AFFINITY_TTL:10m}
    base-cooldown: ${KIRO_BASE_COOLDOWN:60s}
    quota-reset: ${KIRO_QUOTA_RESET:1h}
    probabilistic-retry-chance: ${KIRO_PROBABILISTIC_RETRY:0.1}
    max-request-body-bytes: ${KIRO_MAX_REQUEST_BODY_BYTES:10485760}
    token-refresh-interval-ms: ${KIRO_TOKEN_REFRESH_INTERVAL_MS:3600000}
    token-refresh-initial-delay-ms: ${KIRO_TOKEN_REFRESH_INITIAL_DELAY_MS:60000}
    upstream:
      preferred-endpoint: ${KIRO_PREFERRED_ENDPOINT:codewhisperer}
      endpoints:
        - name: codewhisperer
          url: https://codewhisperer.us-east-1.amazonaws.com/generateAssistantResponse
          origin: AI_EDITOR
          target: AmazonCodeWhispererStreamingService.GenerateAssistantResponse
        - name: amazonq
          url: https://q.us-east-1.amazonaws.com/generateAssistantResponse
          origin: AI_EDITOR
          target: AmazonCodeWhispererStreamingService.GenerateAssistantResponse
        - name: amazonq-cli
          url: https://q.us-east-1.amazonaws.com/SendMessageStreaming
          origin: CLI
          target: AmazonQDeveloperStreamingService.SendMessage
